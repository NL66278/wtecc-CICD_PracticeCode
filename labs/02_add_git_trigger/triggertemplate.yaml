apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: cd-template
spec:
  params:
  # Add parameters here
      - name: repository
        description: This is the URL to the git repository
        default: ""
      - name: branch
        description: Name of the branch in the git repository
        default: "master"
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: cd-pipeline-run-
      spec:
      # Add pipeline definition here
          serviceAccountName: pipeline
          pipelineRef:
              name: cd-pipeline
          params:
          - name: repo-url
            value: $(tt.params.repository)
          - name: branch
            value: $(tt.params.branch)
